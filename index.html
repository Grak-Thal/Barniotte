        } }, 'Rejoindre')));
  }

  function askJoinLink() {
    const sh = openSheet();
    const input = h('input', { type: 'text', id: 'join-link2', placeholder: 'Colle ici le lien d’invitation', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Lien d’invitation' });
    const msg = h('p', { class: 'hint err', 'aria-live': 'polite' });
    const go = () => {
      const p = parseInvite(input.value.trim());
      if (!p) { msg.textContent = 'Ce texte ne contient pas un lien d’invitation complet.'; return; }
      sh.close(); joinGroup(p.api, p.code);
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    sh.set(h('h2', {}, 'Rejoindre un autre groupe'),
      h('p', { class: 'hint' }, 'Colle le lien d’invitation reçu. Ton groupe actuel reste sur ce téléphone et tu pourras y revenir.'),
      input, msg,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'), h('button', { type: 'button', class: 'btn primary', onclick: go }, 'Continuer')));
    setTimeout(() => input.focus(), 50);
  }

  /* Passer à un autre groupe déjà connu : rien n'est effacé, on change seulement de groupe actif. */
  function switchGroup(apiX) {
    const go = () => { lsSet('barniotte-api', apiX); location.reload(); };
    if (!outbox.length) { go(); return; }
    const sh = openSheet();
    sh.set(h('h2', {}, 'Changer de groupe ?'),
      h('p', { class: 'hint err' }, plural(outbox.length, 'modification n’est', 'modifications ne sont') + ' pas encore envoyée' + (outbox.length > 1 ? 's' : '') + '. Elle' + (outbox.length > 1 ? 's restent' : ' reste') + ' sur ce téléphone et partira à ton retour dans ce groupe.'),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'), h('button', { type: 'button', class: 'btn primary', onclick: go }, 'Changer de groupe')));
  }

  function renameGroup(g) {
    const sh = openSheet();
    const input = h('input', { type: 'text', id: 'group-rename', maxlength: '40', value: g.nom, 'aria-label': 'Nom du groupe' });
    const msg = h('p', { class: 'hint err' });
    const save = () => {
      const nom = input.value.trim().slice(0, 40), bad = badText(nom, 40);
      if (bad) { msg.textContent = 'Nom : ' + bad; return; }
      const all = readGroups(), i = all.findIndex(x => x.api === g.api);
      if (i >= 0) { all[i].nom = nom; writeGroups(all); }
      sh.close(); render();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    sh.set(h('h2', {}, 'Nom du groupe'), h('p', { class: 'hint' }, 'Ce nom reste sur ton téléphone. Il n’est pas partagé avec les autres joueurs.'), input, msg,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'), h('button', { type: 'button', class: 'btn primary', onclick: save }, 'Enregistrer')));
    setTimeout(() => input.focus(), 50);
  }

  /* Efface d'un téléphone tout ce qui concerne un groupe (code d'accès, copie des données, identité, envois en attente). */
  function wipeGroup(apiX) {
    const ns = nsOf(apiX), del = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('barniotte-') && k.endsWith(ns)) del.push(k); } } catch (e) { /* ignoré */ }
    del.forEach(lsDel);
    writeGroups(readGroups().filter(x => x.api !== apiX));
  }

  function leaveGroup(apiX) {
    const target = typeof apiX === 'string' ? apiX : API;
    const sh = openSheet();
    const isActive = target === API, pending = isActive ? outbox.length : 0;
    sh.set(h('h2', {}, 'Quitter ce groupe ?'),
      h('p', {}, 'Le groupe est retiré de ce téléphone, avec son code d’accès. Les données restent dans le Sheet : tu pourras revenir avec le lien d’invitation.'),
      pending ? h('p', { class: 'hint err' }, plural(pending, 'modification n’est', 'modifications ne sont') + ' pas encore envoyée' + (pending > 1 ? 's' : '') + ' : elles seront perdues.') : null,
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'),
        h('button', { type: 'button', class: 'btn danger', onclick: () => {
          wipeGroup(target);
          if (isActive) {
            const next = readGroups().find(x => x.api !== target);
            if (next) lsSet('barniotte-api', next.api); else lsDel('barniotte-api');
            location.reload();
          } else { sh.close(); render(); }
        } }, 'Quitter')));
  }

  /* Carte « Mes groupes » : groupes connus de ce téléphone. */
  function groupsCard() {
    const gs = readGroups();
    const card = h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Mes groupes'),
      h('p', { class: 'hint' }, 'Pour passer d’un groupe à l’autre, par exemple en accueillant des collègues d’une autre ville. Chaque groupe garde ses données et ton identité.'));
    gs.forEach((g, i) => {
      const here = g.api === API;
      card.append(h('div', { class: 'stack', style: 'gap:8px;padding:6px 0;border-top:1px solid var(--line)' },
        h('div', {}, h('div', { class: 'nm' }, h('span', { class: 't' }, groupLabel(g, i))), here ? h('div', { class: 'hint' }, 'Groupe actuel') : null),
        h('div', { class: 'btns', style: 'flex-wrap:wrap' },
          here ? null : h('button', { type: 'button', class: 'btn primary', onclick: () => switchGroup(g.api) }, 'Passer à ce groupe'),
          h('button', { type: 'button', class: 'btn ghost', 'aria-label': 'Renommer ' + groupLabel(g, i), onclick: () => renameGroup(g) }, 'Renommer'),
          here || g.api === CONFIG_API ? null : h('button', { type: 'button', class: 'btn ghost', onclick: () => leaveGroup(g.api) }, 'Quitter'))));
    });
    card.append(h('button', { type: 'button', class: 'btn', onclick: askJoinLink }, 'Rejoindre un autre groupe'));
    return card;
  }

  const linkBtn = (href, label) => h('a', { class: 'btn', href, style: 'display:block;text-align:center;text-decoration:none;color:inherit' }, label);

  function viewWelcome() {
    const input = h('input', { type: 'text', id: 'join-link', placeholder: 'Colle ici le lien d’invitation', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Lien d’invitation' });
    const msg = h('p', { class: 'hint err', 'aria-live': 'polite' });
    const go = () => {
      const p = parseInvite(input.value.trim());
      if (!p) { msg.textContent = 'Ce texte ne contient pas un lien d’invitation complet.'; return; }
      msg.textContent = '';
      joinGroup(p.api, p.code);
    };
    return h('div', { class: 'stack' },
      h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Bienvenue'),
        h('p', {}, 'Barniotte suit les matchs, le classement et les duels de ton groupe.'),
        h('p', { class: 'hint' }, 'Pour rejoindre un groupe, ouvre le lien d’invitation envoyé par l’organisateur, ou colle-le ici.'),
        input, msg, h('button', { type: 'button', class: 'btn primary', onclick: go }, 'Rejoindre le groupe')),
      h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Créer un groupe'),
        h('p', { class: 'hint' }, 'Il faut un Google Sheet et un quart d’heure. Le guide explique tout, pas à pas.'),
        linkBtn('tuto.html', 'Voir le guide')),
      h('div', { class: 'card' }, linkBtn('regles.html', 'Règles')));
  }

  async function connect(candidate) {
    const prev = code; code = candidate;
    try {
      const r = await call('ping');
      if (r.ok) { try { localStorage.setItem(CODE_KEY, code); } catch (e) { /* ignoré */ } return { ok: true }; }
      code = prev;
      return { ok: false, msg: r.error === 'code' ? 'Code refusé. Vérifie-le auprès de l’organisateur.' : 'Réponse inattendue du serveur.' };
    } catch (e) {
      code = prev;
      return { ok: false, msg: 'Impossible de joindre le serveur. Vérifie ta connexion et réessaie.' };
    }
  }

  function askCode(message, prefill) {
    const sh = openSheet(true);
    const input = h('input', { type: 'text', id: 'access-code', placeholder: 'barn-xxxx-xxxx-xxxx', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Code d’accès', value: prefill || '' });
    const msg = h('p', { class: 'hint err', 'aria-live': 'polite' }, message || '');
    const go = h('button', { type: 'button', class: 'btn primary', onclick: async () => {
      const v = input.value.trim();
      if (!v) return;
      go.disabled = true; msg.className = 'hint'; msg.textContent = 'Vérification…';
      const r = await connect(v);
      if (r.ok) { sh.close(); net.state = 'idle'; await syncNow(true); afterReady(); startPolling(); }
      else { msg.className = 'hint err'; msg.textContent = r.msg; go.disabled = false; }
    } }, 'Se connecter');
    sh.set(h('h2', {}, 'Code d’accès'),
      h('p', { class: 'hint' }, 'Saisis le code que l’organisateur t’a donné. Tu ne le saisis qu’une fois sur ce téléphone.'),
      input, msg, go);
  }

  let readyDone = false;
  function afterReady() {
    readyDone = true;
    if (!state.players.length) return;
    identityGate();
  }

  function startPolling() {
    if (net.polling || !API) return;
    net.polling = true;
    setInterval(() => { if (document.visibilityState !== 'hidden') syncNow(false); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
    window.addEventListener('online', () => syncNow(true));
  }

  const inviteLink = () => location.origin + location.pathname + '#api=' + encodeURIComponent(API) + '&code=' + encodeURIComponent(code);

  /* ---------- Affichage ---------- */
  const VIEWS = { classement: viewClassement, duels: viewDuels, matchs: viewMatchs, saison: viewSaison };
  function currentTab() { const t = (location.hash || '').slice(1); return TABS.includes(t) ? t : 'classement'; }
  function render() {
    const tab = currentTab(), s = curSeason();
    document.querySelectorAll('.tab').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    document.getElementById('season-label').textContent = s ? s.name + ' · depuis le ' + fmtShort(s.start) : 'Aucune saison ouverte';
    const who = document.getElementById('who');
    who.replaceChildren('Je suis ', h('b', {}, me || '?'));
    paintNet();
    if (HOSTED && !API) { document.getElementById('main').replaceChildren(viewWelcome()); return; }
    if (API && !net.loaded && !state.players.length) {
      document.getElementById('main').replaceChildren(h('div', { class: 'card stack' },
        h('p', {}, net.state === 'offline' || net.state === 'error' ? 'Impossible de joindre le serveur pour le moment.' : 'Chargement des données…'),
        net.state === 'offline' || net.state === 'error' ? h('button', { type: 'button', class: 'btn', onclick: () => syncNow(true) }, 'Réessayer') : null));
      return;
    }
    document.getElementById('main').replaceChildren(VIEWS[tab]());
    checkPodium();
  }

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { if (currentTab() === b.dataset.tab) { window.scrollTo(0, 0); render(); } else location.hash = b.dataset.tab; }));
  document.getElementById('fab').addEventListener('click', () => { if (HOSTED && !API) return; if (!me) askWho(); else if (needsPin()) enterIdentity(me); else startMatch(); });
  document.getElementById('who').addEventListener('click', () => { location.hash = 'saison'; });
  document.getElementById('theme').addEventListener('click', () => setTheme(isDark() ? 'light' : 'dark'));
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  document.getElementById('net').addEventListener('click', () => syncNow(true));
  applyTheme();
  if (API && !snap) takeSnap();
  render();
  (async function boot() {
    const link = takeLinkFromHash();
    if (link && link.api && link.api !== API) { await joinGroup(link.api, link.code); return; }
    if (!API) {
      if (HOSTED) { net.state = 'locked'; paintNet(); render(); return; }
      if (!me || !state.players.some(p => p.name === me && p.active)) askWho(); else checkPending();
      return;
    }
    if (link && link.code) {
      const r = await connect(link.code);
      if (!r.ok) { askCode(r.msg, link.code); return; }
    }
    if (!code) { net.state = 'locked'; paintNet(); askCode(); return; }
    net.state = 'idle';
    await syncNow(true);
    afterReady();
    startPolling();
  })();
})();

</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }</script>
</body>
