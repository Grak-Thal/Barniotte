<!doctype html>
<html lang="fr">
<head>

<title>Barniotte</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="referrer" content="no-referrer">

<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme: dark)">
<meta name="description" content="Suivi des parties de Barniotte : classement, duels, historique.">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concept : un tableau de marque de club, sobre, pensé pour une main sur le téléphone.
   Les chiffres du jeu (scores, pourcentages) prennent la police condensée, tout le reste reste calme. */
:root {
  --bg: #EDF0EC;
  --surface: #FFFFFF;
  --surface2: #E4EAE5;
  --ink: #13201A;
  --muted: #57665E;
  --line: #D3DCD5;
  --accent: #1E6B50;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAEADF;
  --gold: #7D5F0C;
  --gold-soft: #F3EBCD;
  --danger: #A8381F;
  --danger-soft: #F7DDD6;
  --scrim: rgba(10, 20, 15, .5);
  --shadow: 0 1px 2px rgba(19, 32, 26, .08), 0 10px 28px rgba(19, 32, 26, .10);
  --c1: #1E6B50; --c2: #BF5418; --c3: #2B60B0; --c4: #8A3FA8; --c5: #B5316A; --c6: #8F7108; --c7: #55626B;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1310; --surface: #141E19; --surface2: #1B2822; --ink: #E7EFEA; --muted: #93A59B; --line: #26342D;
    --accent: #5CC49B; --accent-ink: #06150F; --accent-soft: #19382C;
    --gold: #E2BE5C; --gold-soft: #372D10; --danger: #F1907A; --danger-soft: #3B1C16; --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    --c1: #5CC49B; --c2: #F0985C; --c3: #82ABF0; --c4: #C592DF; --c5: #F08AB2; --c6: #DABA4C; --c7: #9DABB5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1310; --surface: #141E19; --surface2: #1B2822; --ink: #E7EFEA; --muted: #93A59B; --line: #26342D;
  --accent: #5CC49B; --accent-ink: #06150F; --accent-soft: #19382C;
  --gold: #E2BE5C; --gold-soft: #372D10; --danger: #F1907A; --danger-soft: #3B1C16; --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  --c1: #5CC49B; --c2: #F0985C; --c3: #82ABF0; --c4: #C592DF; --c5: #F08AB2; --c6: #DABA4C; --c7: #9DABB5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  padding-block: 14px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 30px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.who { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.who b { font-weight: 600; }

/* Blocs */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.sec-h { font: 600 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.hint { color: var(--muted); font-size: 13px; }
.hint.err { color: var(--danger); font-weight: 600; }
.note { background: var(--gold-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.warn { background: var(--danger-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Progression */
.prog { display: grid; gap: 8px; }
.prog .row { font-size: 13px; color: var(--muted); }
.prog .row b { color: var(--ink); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Classement */
.banner { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 14px; }
.banner b { font: 700 24px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; display: block; }
.rk { display: grid; grid-template-columns: 22px minmax(0, 1fr) 30px 30px 50px 44px 42px; gap: 6px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rk.head { border-top: 0; padding: 0 0 6px; font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rk .n { font: 700 22px/1 var(--f-display); color: var(--muted); }
.rk .num { text-align: right; font-variant-numeric: tabular-nums; }
.rk .big { font: 700 22px/1 var(--f-display); }
.rk .nm { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 7px; min-width: 0; }
.rk .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.form { display: flex; gap: 3px; margin-top: 5px; }
.form i { width: 12px; height: 5px; border-radius: 2px; background: var(--ok, var(--accent)); }
.form i.d { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.tag { font-size: 11px; font-weight: 600; color: var(--gold); background: var(--gold-soft); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

/* Graphique */
.chart svg { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-t { fill: var(--muted); font: 11px var(--f-body); }
.ch-lbl { font: 600 12px var(--f-body); }

/* Duels */
.duel { border-top: 1px solid var(--line); padding: 10px 0; }
.duel:first-of-type { border-top: 0; }
.duel summary { list-style: none; cursor: pointer; display: grid; gap: 7px; }
.duel summary::-webkit-details-marker { display: none; }
.duel .names { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.duel .vs { font-weight: 600; }
.duel .h2h { font: 700 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.duel .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.duel ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.duel li { display: flex; justify-content: space-between; gap: 10px; }
.duel li span:last-child { color: var(--muted); }

/* Historique */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip:disabled { opacity: .35; cursor: not-allowed; }
.day { font: 600 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 0 8px; }
.day span { font-weight: 500; letter-spacing: .06em; }
.mrow { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: grid; gap: 6px; margin-bottom: 8px; }
.mline { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.mline .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.mline .p.w { color: var(--ink); font-weight: 700; }
.mline .p:last-child { text-align: right; }
.mline .sc { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mrow .sub2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--danger); background: var(--danger-soft); border-radius: 6px; padding: 2px 6px; }

/* Boutons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 52px; text-align: center; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 11px 12px; font: inherit; min-height: 46px; }

/* Saisie du score */
.score { display: grid; gap: 14px; }
.side-name { font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.nums { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.nums button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 700 22px/1 var(--f-display); }
.nums button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ba { display: grid; gap: 4px; font-size: 15px; }
.ba .was { color: var(--muted); text-decoration: line-through; }

/* Fenêtres */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding-top: env(safe-area-inset-top, 0px); }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94%; overflow: auto; border-radius: 20px 20px 0 0; display: grid; gap: 16px; align-content: start;
  padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet h2 { font: 700 26px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.sheet .lbl { font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }

/* Barre d'onglets */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tabs { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 78px 1fr 1fr; align-items: end; }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; font-size: 11.5px; color: var(--muted); min-height: 50px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab { justify-self: center; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -26px; box-shadow: var(--shadow); }
.fab svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

/* Message */
.toast { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.toast div { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; box-shadow: var(--shadow); max-width: 520px; }
.toast button { background: none; border: 0; color: var(--bg); text-decoration: underline; font-weight: 700; padding: 0; }

/* Journal */
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13.5px; }
.log li { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.log li:first-child { border-top: 0; padding-top: 0; }
.log time { color: var(--muted); font-size: 12px; }
.plist { display: grid; gap: 8px; }
.plist .row { border-top: 1px solid var(--line); padding-top: 8px; }
.plist .row:first-child { border-top: 0; padding-top: 0; }

.rowbtns { display: flex; gap: 8px; align-items: center; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip.del { color: var(--danger); }
.chip.del:hover { background: var(--danger-soft); }

.netline { justify-self: start; display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 2px 0; margin-top: -8px; color: var(--muted); font-size: 12.5px; text-align: left; }
.netline .nd { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.netline.ok .nd { background: var(--accent); }
.netline.sync .nd, .netline.idle .nd, .netline.pending .nd { background: var(--gold); }
.netline.offline .nd, .netline.error .nd, .netline.locked .nd { background: var(--danger); }

/* Podium de fin de saison */
.podium { display: grid; gap: 10px; margin: 12px 0; }
.pod { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); }
.pod .pl { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 700 22px var(--f-display); color: #1b1b1b; }
.pod.gold .pl { background: #E2BE5C; }
.pod.silver .pl { background: #C4CBCF; }
.pod.bronze .pl { background: #C98E5B; }
.pod.gold { border-color: #E2BE5C; }
.pod .pn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 22px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.pod .aux { margin-top: 4px; font-size: 14px; color: var(--accent); font-weight: 600; }
.podium-sub { font-weight: 600; margin: 0; }

.pin-in { width: 100%; text-align: center; letter-spacing: .5em; font: inherit; font-size: 26px; font-weight: 700; min-height: 54px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; }
.pin-in::placeholder { letter-spacing: .3em; color: var(--muted); font-weight: 400; }
.hint.ver { text-align: center; margin-top: 4px; }

.welcome .steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }

</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 class="brand">Barniotte</h1>
      <p class="sub" id="season-label"></p>
    </div>
    <div class="rowbtns">
      <button type="button" class="iconbtn" id="theme"></button>
      <button type="button" class="who" id="who"></button>
    </div>
  </header>
  <button type="button" class="netline" id="net"></button>
  <main id="main"></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabs">
    <button type="button" class="tab" data-tab="classement">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>
      Classement
    </button>
    <button type="button" class="tab" data-tab="duels">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
      Duels
    </button>
    <button type="button" class="fab" id="fab" aria-label="Nouveau match">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="tab" data-tab="matchs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Matchs
    </button>
    <button type="button" class="tab" data-tab="saison">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Gestion
    </button>
  </div>
</nav>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* Règles du jeu et calculs : aucune dépendance au navigateur. */
const Core = (() => {
  const TARGET = 7;
  const COMBO = "Big barniotte à l'ancienne";
  const MODS = ["Big barniotte", "À l'ancienne", COMBO, "Figure"];
  /* Le coup combiné remplace les deux coups séparés, et inversement. */
  const modsNorm = (sel, opt, on) => { if (!on) return; if (opt === COMBO) { sel.delete(MODS[0]); sel.delete(MODS[1]); } else if (opt === MODS[0] || opt === MODS[1]) sel.delete(COMBO); };
  const fr = (a, b) => a.localeCompare(b, 'fr');
  const key = (a, b) => [a, b].sort(fr).join('|');
  const winner = m => (m.sa === m.sb ? null : (m.sa > m.sb ? m.a : m.b));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byTime = (x, y) => (x.ts < y.ts ? -1 : x.ts > y.ts ? 1 : String(x.id).localeCompare(String(y.id), undefined, { numeric: true }));

  /* Renvoie un message d'erreur, ou null si le score est valide. */
  function checkScore(sa, sb) {
    if (!Number.isInteger(sa) || !Number.isInteger(sb)) return "Choisis le score des deux joueurs.";
    if (sa === TARGET && sb === TARGET) return "Pas de match nul : un seul joueur peut avoir 7 points.";
    if (Math.max(sa, sb) !== TARGET) return "Le vainqueur doit avoir exactement 7 points.";
    return null;
  }

  /* Nombre de matchs d'un duo dans la saison (terminés et en cours), pour le quota. */
  function pairCountAll(state, season, a, b) {
    const k = key(a, b);
    return state.matches.filter(m => m.season === season.id && m.status !== 'annule' && key(m.a, m.b) === k).length;
  }

  /* Plus grand nombre de matchs joués par un duo : le quota ne peut pas descendre en dessous. */
  function maxPairCount(state, season) {
    let max = 0;
    const P = season.players;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      max = Math.max(max, pairCountAll(state, season, P[i], P[j]));
    }
    return max;
  }

  /* Classement d'une saison, duos et courbe d'évolution. Seuls les matchs terminés comptent. */
  function standings(state, season) {
    const ms = state.matches.filter(m => m.season === season.id && m.status === 'termine').sort(byTime);
    const P = season.players.slice();
    const st = {};

    const pr = {};

    if (!net.admins.length) card.append(h('p', { class: 'warn' }, 'Aucun administrateur n’est défini : tous les joueurs peuvent tout modifier. Pour changer cela, écris le nom du créateur dans le script (ADMINS), puis redéploie-le.'));
    else card.append(h('p', { class: 'hint' }, 'Les administrateurs peuvent ouvrir et clôturer les saisons, gérer les joueurs, corriger les matchs terminés et changer le code d’accès. Ceux du script ne peuvent être retirés que depuis le script. Seul un joueur qui a déjà créé son code PIN peut être nommé. Si tu coupes l’accès d’un joueur (Inactif), pense à changer le code d’accès du groupe : il connaît encore l’ancien lien.'));
    const list = h('div', { class: 'plist' });
    state.players.filter(p => p.active).forEach(p => {
      const isA = net.admins.includes(p.name);
      list.append(h('div', { class: 'row' }, h('span', {}, p.name),
        h('div', { class: 'rowbtns' },
          net.admins.length && (isA || net.pinned.includes(p.name)) ? h('button', { type: 'button', class: 'chip' + (isA ? ' on' : ''), 'aria-pressed': isA ? 'true' : 'false', onclick: () => adminCall('admin_set', { name: p.name, admin: !isA }).then(r => { if (r) toast(p.name + (isA ? ' n’est plus admin.' : ' est admin.')); }) }, isA ? 'Admin' : 'Joueur') : null,
          net.pinned.includes(p.name) ? h('button', { type: 'button', class: 'chip del', 'aria-label': 'Réinitialiser le code de ' + p.name, onclick: () => {
            const sh = openSheet();
            const np = pinField('pin-reset', 'Nouveau code provisoire de ' + p.name), msg = h('p', { class: 'hint', 'aria-live': 'polite' });
            const go = h('button', { type: 'button', class: 'btn danger', disabled: true, onclick: async () => {
              if (pinWeak(np.value)) { msg.className = 'hint err'; msg.textContent = 'Ce code est trop facile à deviner.'; return; }
              const r = await adminCall('pin_reset', { name: p.name, pin: np.value });
              if (r) { sh.close(); toast('Nouveau code de ' + p.name + ' enregistré. Transmets-le lui.'); }
            } }, 'Enregistrer le nouveau code');
            np.addEventListener('input', () => { go.disabled = !/^\d{6}$/.test(np.value); });
            sh.set(h('h2', {}, 'Nouveau code pour ' + p.name),
              h('p', {}, p.name + ' sera déconnecté de tous ses téléphones. Choisis un code à 6 chiffres et transmets-le lui : il s’en servira pour se reconnecter. Le nom n’est jamais libre entre-temps.'),
              np, msg,
              h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'), go));
          } }, 'Code') : null)));
    });
    card.append(list, h('button', { type: 'button', class: 'btn ghost', onclick: changeCodeFlow }, 'Changer le code d’accès du groupe'));
    return card;
  }

  /* Qui peut toucher à un match : un administrateur, ou son auteur (pour un match en cours, ou dans les 10 minutes après la fin). */
  function matchRight(m) {
    if (isAdmin()) return { ok: true };
    if (m.by !== me) return { ok: false, why: 'Seul l’auteur du match (pendant 10 minutes) ou un administrateur peut le modifier.' };
    if (m.status === 'en_cours') return { ok: true };
    if (m.fin == null || (m.fin > 0 && serverNow() - m.fin <= DELAI_MATCH_MS)) return { ok: true };
    return { ok: false, why: 'Le délai de 10 minutes pour corriger ton match est dépassé. Demande à un administrateur.' };
  }
  function editMatch(m) {
    const right = matchRight(m);
    if (!right.ok) {
      const sh = openSheet();
      sh.set(h('h2', {}, m.a + ' vs ' + m.b),
        h('p', { class: 'hint' }, 'Match du ' + fmtDay(m.ts.slice(0, 10)) + '. Saisi par ' + m.by + '.'),
        m.status === 'termine' ? h('p', {}, m.a + ' ' + sc(m) + ' ' + m.b) : h('p', {}, 'Match en cours.'),
        h('p', { class: 'hint' }, right.why),
        h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Fermer')));
      return;
    }
    if (m.status === 'en_cours') { const sh = openSheet(); scoreStep(m, sh); return; }
    const sh = openSheet();
    let vals = [m.sa, m.sb], valid = true, sel = m.mods.slice();
    const sameMods = () => sel.length === m.mods.length && sel.every(x => m.mods.includes(x));
    const changedScore = () => vals[0] !== m.sa || vals[1] !== m.sb;
    const save1 = h('button', { type: 'button', class: 'btn primary', disabled: true, onclick: onSave }, 'Enregistrer');
    const refresh = () => { save1.disabled = !valid || (!changedScore() && sameMods()); };
    function onSave() {
      if (!changedScore()) { applyEdit(); return; }
      const w = vals[0] > vals[1] ? m.a : m.b;
      sh.set(
        h('h2', {}, 'Confirmer la modification'),
        h('p', { class: 'warn' }, 'Ce match est terminé. Le classement va changer. Ta modification sera inscrite dans le journal.'),
        h('div', { class: 'card ba' },
          h('div', { class: 'was' }, m.a + ' ' + sc(m) + ' ' + m.b),
          h('div', {}, h('b', {}, m.a + ' ' + vals[0] + '–' + vals[1] + ' ' + m.b), ' (victoire de ' + w + ')')),
        h('div', { class: 'btns' },
          h('button', { type: 'button', class: 'btn ghost', onclick: () => editMatch(m) }, 'Retour'),
          h('button', { type: 'button', class: 'btn primary', onclick: applyEdit }, 'Confirmer')));
    }
    function applyEdit() {
      const parts = [];
      if (changedScore()) parts.push('score ' + m.sa + '–' + m.sb + ' → ' + vals[0] + '–' + vals[1]);
      if (!sameMods()) parts.push('coups spéciaux : ' + (m.mods.join(', ') || 'aucun') + ' → ' + (sel.join(', ') || 'aucun'));
      logEntry(m.a + ' vs ' + m.b + ' du ' + fmtShort(m.ts.slice(0, 10)) + ' : ' + parts.join(' ; '), m.id);
      m.sa = vals[0]; m.sb = vals[1]; m.mods = sel.slice();
      commit(); sh.close(); toast('Modification enregistrée.');
    }
    sh.set(
      h('h2', {}, m.a + ' vs ' + m.b),
      h('p', { class: 'hint' }, 'Match du ' + fmtDay(m.ts.slice(0, 10)) + '. Saisi par ' + m.by + '.'),
      scorePicker(m.a, m.b, [m.sa, m.sb], (a, b, ok) => { vals = [a, b]; valid = ok; refresh(); }),
      h('div', {}, h('div', { class: 'lbl' }, 'Coups spéciaux du vainqueur'),
        chips(MODS, { multi: true, selected: sel, norm: modsNorm, onChange: v => { sel = v; refresh(); } })),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Fermer'), save1));
    refresh();
  }

  /* ---------- Match non terminé à l'ouverture ---------- */
  function checkPending() {
    if (!me) return;
    const m = state.matches.find(x => x.status === 'en_cours' && x.by === me);
    if (!m) return;
    const sh = openSheet(true);
    sh.set(
      h('h2', {}, 'Match non terminé'),
      h('p', {}, m.a + ' vs ' + m.b + ', démarré le ' + fmtStamp(m.ts) + '.'),
      h('p', {}, 'Voulez-vous le finir ?'),
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'btn danger', onclick: () => {
          m.status = 'annule'; logEntry('Match non terminé annulé : ' + m.a + ' vs ' + m.b + ' (démarré le ' + fmtStamp(m.ts) + ')', m.id);
          commit(); sh.close();
          toast('Match supprimé.', () => { m.status = 'en_cours'; logEntry('Suppression annulée : ' + m.a + ' vs ' + m.b, m.id); commit(); });
        } }, 'Non'),
        h('button', { type: 'button', class: 'btn primary', onclick: () => scoreStep(m, sh) }, 'Oui')));
  }

  /* ---------- Identité et code PIN ----------
     Si l'organisateur a activé les codes (PIN_ACTIF dans le script), chaque joueur crée un code à 6 chiffres la première fois qu'il choisit son nom.
     Le serveur vérifie le code et bloque le nom après 5 essais ratés. Le téléphone retient qui s'est identifié : le code n'est redemandé qu'en changeant de téléphone ou de joueur. */
  const pinOn = () => !!(API && net.pin);
  const needsPin = () => pinOn() && !!me && state.players.some(p => p.name === me && p.active) && (pinok !== me || (net.version >= 5 && !token));
  function identityGate() {
    if (!me || !state.players.some(p => p.name === me && p.active)) { askWho(); return false; }
    if (needsPin()) { enterIdentity(me); return false; }
    checkPending(); return true;
  }
  function enterIdentity(name) {
    if (!pinOn()) { setMe(name); if (openSh) openSh.close(); render(); checkPending(); return; }
    if (net.pinned.includes(name)) askPin(name); else createPin(name);
  }
  function identityDone(name) {
    pinok = name; lsSet(PINOK_KEY, name); setMe(name);
    if (openSh) openSh.close();
    render(); checkPending();
    if (pinOn()) setTimeout(() => syncNow(true), 50);
  }
  const pinField = (id, label) => {
    const el = h('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '6', autocomplete: 'off', id, class: 'pin-in', 'aria-label': label, placeholder: '••••••' });
    el.addEventListener('input', () => { const v = el.value.replace(/\D/g, '').slice(0, 6); if (v !== el.value) el.value = v; });
    return el;
  };
  const pinWeak = p => /^(\d)\1{5}$/.test(p) || p === '123456' || p === '654321' || p === '012345';
  const NET_MSG = 'Impossible de joindre le serveur. Vérifie ta connexion et réessaie.';
  function addPinned(name) { if (!net.pinned.includes(name)) { net.pinned.push(name); savePinInfo(); } }

  function askWho() {
    const sh = openSheet(true);
    const act = state.players.filter(p => p.active).map(p => p.name);
    const on = pinOn();
    const free = on ? (act.length ? act : (net.admins || [])).filter(n => !net.pinned.includes(n)) : act;
    const taken = on ? act.filter(n => net.pinned.includes(n)) : [];
    const retrouver = () => sh.set(
      h('h2', {}, 'Retrouver mon nom'),
      h('p', { class: 'hint' }, 'Choisis ton nom, puis saisis le code PIN que tu avais créé.'),
      chips(taken, { onChange: v => askPin(v[0]) }),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: askWho }, 'Retour')));
    sh.set(
      h('h2', {}, 'Qui es-tu ?'),
      h('p', { class: 'hint' }, on
        ? 'Les noms déjà pris ne sont pas proposés. Choisis ton nom, puis crée un code PIN à 6 chiffres : il évite que quelqu’un joue à ta place.'
        : 'Ton nom sert à retrouver qui a saisi ou modifié un match. Il n’y a pas de mot de passe : tout repose sur la confiance, comme à la table.'),
      free.length ? chips(free, { onChange: v => enterIdentity(v[0]) }) : h('p', { class: 'hint' }, 'Tous les noms sont déjà pris.'),
      taken.length ? h('button', { type: 'button', class: 'btn ghost', onclick: retrouver }, 'Mon nom est déjà pris : j’ai un code PIN') : null);
  }

  function askPin(name, note) {
    const sh = openSheet(true);
    const inp = pinField('pin-in', 'Code PIN de ' + name), msg = h('p', { class: 'hint', 'aria-live': 'polite' });
    const go = h('button', { type: 'button', class: 'btn primary', disabled: true, onclick: submit }, 'Valider');
    inp.addEventListener('input', () => { go.disabled = !/^\d{6}$/.test(inp.value); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) submit(); });
    async function submit() {
      go.disabled = true; msg.className = 'hint'; msg.textContent = 'Vérification…';
      try {
        const r = await call('pin_check', { name, pin: inp.value });
        if (r.ok) { identityDone(name); return; }
        if (r.error === 'pin_inactif') { identityDone(name); return; }
        if (r.error === 'pin_aucun') { net.pinned = net.pinned.filter(n => n !== name); savePinInfo(); createPin(name); return; }
        msg.className = 'hint err';
        if (r.error === 'verrou') msg.textContent = 'Trop d’essais : ce nom est bloqué encore ' + plural(r.wait || 15, 'minute', 'minutes') + '.';
        else if (r.error === 'pin') msg.textContent = 'Code incorrect. Il te reste ' + plural(r.left, 'essai', 'essais') + ' avant un blocage de 15 minutes.';
        else if (r.error === 'inactif') msg.textContent = 'Ton accès a été coupé par un administrateur du groupe.';
        else if (r.error === 'code') msg.textContent = 'Le code d’accès du groupe n’est plus valable. Recharge l’appli.';
        else msg.textContent = 'Erreur : ' + (r.error || 'inconnue');
      } catch (e) { msg.className = 'hint err'; msg.textContent = NET_MSG; }
      inp.value = ''; go.disabled = true; inp.focus();
    }
    sh.set(h('h2', {}, 'Bonjour ' + name),
      h('p', { class: 'hint' }, note || 'Saisis ton code PIN à 6 chiffres. Tu ne le saisis qu’une fois sur ce téléphone.'),
      inp, msg,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: askWho }, 'Ce n’est pas moi'), go),
      h('p', { class: 'hint' }, 'Code oublié ? L’organisateur peut le réinitialiser.'));
    setTimeout(() => inp.focus(), 50);
  }

  function createPin(name) {
    const sh = openSheet(true);
    const p1 = pinField('pin-new', 'Choisis ton code PIN'), p2 = pinField('pin-new2', 'Confirme ton code PIN'), msg = h('p', { class: 'hint', 'aria-live': 'polite' });
    const go = h('button', { type: 'button', class: 'btn primary', disabled: true, onclick: submit }, 'Créer mon code');
    const check = () => { go.disabled = !(/^\d{6}$/.test(p1.value) && p1.value === p2.value); msg.className = 'hint'; msg.textContent = p2.value.length === 6 && p1.value !== p2.value ? 'Les deux codes ne sont pas identiques.' : ''; };
    p1.addEventListener('input', check); p2.addEventListener('input', check);
    async function submit() {
      if (pinWeak(p1.value)) { msg.className = 'hint err'; msg.textContent = 'Ce code est trop facile à deviner. Choisis-en un autre.'; return; }
      go.disabled = true; msg.className = 'hint'; msg.textContent = 'Création…';
      try {
        const r = await call('pin_set', { name, pin: p1.value });
        if (r.ok) { addPinned(name); identityDone(name); toast('Code créé. Note-le : il te servira sur un autre téléphone.'); return; }
        if (r.error === 'pin_inactif') { identityDone(name); return; }
        if (r.error === 'pin_deja') { addPinned(name); toast(name + ' a déjà un code.'); askPin(name); return; }
        msg.className = 'hint err';
        if (r.error === 'joueur') msg.textContent = 'Ce nom n’est pas encore enregistré. Si le groupe est tout neuf, seul le nom du créateur écrit dans le script est accepté ; sinon demande à un administrateur de t’ajouter.';
        else if (r.error === 'pin_format') msg.textContent = 'Le code doit faire 6 chiffres, pas trop évidents.';
        else msg.textContent = 'Erreur : ' + (r.error || 'inconnue');
      } catch (e) { msg.className = 'hint err'; msg.textContent = NET_MSG; }
      go.disabled = false;
    }
    sh.set(h('h2', {}, 'Crée ton code PIN, ' + name),
      h('p', { class: 'hint' }, '6 chiffres que tu es le seul à connaître. Il te sera demandé si tu changes de téléphone ou si tu te connectes depuis un ordinateur. Évite une date de naissance.'),
      h('div', {}, h('div', { class: 'lbl hint' }, 'Code'), p1),
      h('div', {}, h('div', { class: 'lbl hint' }, 'Confirme le code'), p2),
      msg,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn ghost', onclick: askWho }, 'Ce n’est pas moi'), go));
    setTimeout(() => p1.focus(), 50);
  }

  /* ---------- Onglet Classement ---------- */
  function chartSVG(S) {
    const days = S.days;
    if (days.length < 2) return null;
    const W = 360, H = 210, L = 36, R = 62, T = 10, B = 26;
    const x = i => L + (W - L - R) * (i / (days.length - 1));
    const y = p => T + (H - T - B) * (1 - p);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Évolution du pourcentage de victoires cumulé de chaque joueur">';
    [0, .25, .5, .75, 1].forEach(g => {
      svg += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '"/>';
      svg += '<text class="ch-t" x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + Math.round(g * 100) + ' %</text>';
    });
    const ends = [];
    Object.keys(S.timeline).forEach(p => {
      const pts = S.timeline[p];
      if (!pts.length) return;
      const d = pts.map(q => x(days.indexOf(q.day)).toFixed(1) + ',' + y(q.pct).toFixed(1)).join(' ');
      const col = colorOf(p), last = pts[pts.length - 1];
      svg += '<polyline fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + d + '"/>';
      svg += '<circle cx="' + x(days.indexOf(last.day)).toFixed(1) + '" cy="' + y(last.pct).toFixed(1) + '" r="3.5" fill="' + col + '"/>';
      ends.push({ p, col, y: y(last.pct) });
    });
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    ends.forEach(e => { svg += '<text class="ch-lbl" x="' + (W - R + 8) + '" y="' + (e.y + 4) + '" fill="' + e.col + '">' + esc(e.p) + '</text>'; });
    svg += '<text class="ch-t" x="' + L + '" y="' + (H - 6) + '">' + esc(fmtShort(days[0])) + '</text>';
    svg += '<text class="ch-t" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtShort(days[days.length - 1])) + '</text>';
    return svg + '</svg>';
  }

  /* Intersaison : pas de classement, juste les derniers résultats de chacun et les duos les moins joués. */
  function viewInter(s) {
    const S = standings(state, eff(s));
    const total = S.pairs.reduce((a, p) => a + p.n, 0);
    const out = h('div', { class: 'stack' });
    out.append(h('div', { class: 'banner' }, h('b', {}, 'Intersaison'),
      h('span', {}, 'Les matchs sont gardés dans l’historique mais ne comptent pour aucun classement. ' + plural(total, 'match joué', 'matchs joués') + '.')));
    const card = h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Joueurs'));
    S.rows.slice().sort((x, y) => fr(x.name, y.name)).forEach(r => {
      card.append(h('div', { class: 'row' },
        h('div', { style: 'min-width:0' },
          h('div', { class: 'nm' }, h('i', { class: 'dot', style: 'background:' + colorOf(r.name) }), h('span', { class: 't' }, r.name)),
          h('div', { class: 'form', 'aria-label': 'Derniers résultats' }, r.form.slice(-5).map(f => h('i', { class: f === 'V' ? '' : 'd' })))),
        h('span', { class: 'hint' }, plural(r.J, 'match', 'matchs'))));
    });
    out.append(card);
    const least = S.pairs.slice().sort((x, y) => x.n - y.n || fr(x.a, y.a)).slice(0, 5);
    if (least.length) {
      const c2 = h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Pour varier les adversaires'),
        h('p', { class: 'hint' }, 'Les duos les moins joués.'));
      least.forEach(p => c2.append(h('div', { class: 'row' }, h('span', {}, p.a + ' vs ' + p.b), h('span', { class: 'hint' }, plural(p.n, 'match', 'matchs')))));
      out.append(c2);
    }
    return out;
  }

  function viewClassement() {
    const s = curSeason();
    if (!s) {
      if (isEmptyGroup()) return h('div', { class: 'stack' }, welcomeCard());
      const last = state.seasons.filter(isArch).slice(-1)[0];
      return h('div', { class: 'stack' }, h('div', { class: 'card stack' },
        h('h2', { class: 'sec-h' }, 'Pas de saison ouverte'),
        last ? h('p', {}, last.name + ' est archivée.') : null,
        h('p', { class: 'hint' }, 'Ouvre une nouvelle saison pour enregistrer des matchs.'),
        h('button', { type: 'button', class: 'btn primary', onclick: () => { location.hash = 'saison'; } }, 'Ouvrir une saison')));
    }
    if (isInter(s)) return viewInter(s);
    const S = standings(state, s);
    const out = h('div', { class: 'stack' });
    if (S.complete) {
      out.append(h('div', { class: 'banner' },

    }
    out.append(h('div', { class: 'card prog' },
      h('div', { class: 'row' }, h('span', {}, h('b', {}, S.played + ' / ' + S.total), ' matchs de saison joués'), h('span', {}, s.quota + ' par duo')),
      h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(S.total), 'aria-valuenow': String(S.played) }, h('i', { style: 'width:' + (S.total ? Math.round(100 * S.played / S.total) : 0) + '%' }))));

    const card = h('div', { class: 'card' },
      h('div', { class: 'rk head' }, h('span', {}), h('span', {}, 'Joueur'), h('span', { class: 'num' }, 'J'), h('span', { class: 'num' }, 'V'), h('span', { class: 'num' }, '%'), h('span', { class: 'num' }, 'Pts'), h('span', { class: 'num' }, 'Rest.')));
    S.rows.forEach((r, i) => {
      card.append(h('div', { class: 'rk' },

          h('div', { class: 'nm' }, h('i', { class: 'dot', style: 'background:' + colorOf(r.name) }), h('span', { class: 't' }, r.name), S.complete && r.tie ? h('span', { class: 'tag' }, 'ex æquo') : null, r.aux ? h('span', { class: 'tag', title: 'À égalité de victoires, départagé aux points marqués' }, 'aux points') : null),
          h('div', { class: 'form', 'aria-label': 'Derniers résultats' }, r.form.slice(-5).map(f => h('i', { class: f === 'V' ? '' : 'd' })))),
        h('span', { class: 'num' }, String(r.J)), h('span', { class: 'num' }, String(r.V)),
        h('span', { class: 'num big' }, pct(r.V, r.J)), h('span', { class: 'num' }, String(r.pts)), h('span', { class: 'num' }, String(r.rest))));
    });
    card.append(h('p', { class: 'hint', style: 'margin-top:10px' },
      S.complete
        ? 'Classement final : victoires, puis total de points marqués. « Aux points » : à égalité de victoires, place gagnée au total de points marqués.'
        : 'Classement provisoire, trié au % de victoires car tout le monde n’a pas joué autant. Égalité : total de points marqués. J matchs joués, V victoires, Pts points marqués, Rest. matchs restants.'));
    out.append(card);
    const svg = chartSVG(S);
    if (svg) { const c = h('div', { class: 'card chart' }, h('h2', { class: 'sec-h' }, '% de victoires au fil des jours de jeu')); c.insertAdjacentHTML('beforeend', svg); out.append(c); }
    return out;
  }

  /* ---------- Onglet Duels ---------- */
  function viewDuels() {
    const s = curSeason();
    if (!s) return h('div', { class: 'card' }, h('p', { class: 'hint' }, 'Aucune saison ouverte.'));
    if (isInter(s)) {
      const SI = standings(state, eff(s));
      const maxN = Math.max(1, ...SI.pairs.map(p => p.n));
      const ci = h('div', { class: 'card' }, h('h2', { class: 'sec-h' }, 'Matchs joués par duo'),
        h('p', { class: 'hint' }, 'Les duos les moins joués sont en haut, pour varier les adversaires.'));
      SI.pairs.slice().sort((x, y) => x.n - y.n || fr(x.a, y.a)).forEach(p => {
        ci.append(h('details', { class: 'duel' },
          h('summary', {},
            h('div', { class: 'names' }, h('span', { class: 'vs' }, p.a + ' vs ' + p.b)),
            h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(100 * p.n / maxN) + '%' })),
            h('div', { class: 'meta' }, h('span', {}, plural(p.n, 'match', 'matchs')))),
          h('ul', {}, p.list.slice().sort((x, y) => byTime(y, x)).map(m => h('li', {}, h('span', {}, m.a + ' ' + sc(m) + ' ' + m.b), h('span', {}, fmtShort(m.ts.slice(0, 10))))))));
      });
      return ci;
    }
    const S = standings(state, s);
    const card = h('div', { class: 'card' }, h('h2', { class: 'sec-h' }, 'Matchs joués par duo'));
    S.pairs.slice().sort((x, y) => y.remaining - x.remaining || fr(x.a, y.a)).forEach(p => {
      card.append(h('details', { class: 'duel' },
        h('summary', {},
          h('div', { class: 'names' }, h('span', { class: 'vs' }, p.a + ' vs ' + p.b), h('span', { class: 'h2h' }, p.wa + ' – ' + p.wb)),
          h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.min(100, Math.round(100 * p.n / s.quota)) + '%' })),
          h('div', { class: 'meta' }, h('span', {}, p.n + ' / ' + s.quota + ' matchs'), h('span', {}, p.remaining ? plural(p.remaining, 'restant', 'restants') : 'Terminé'))),
        h('ul', {}, p.list.slice().sort((x, y) => byTime(y, x)).map(m => h('li', {}, h('span', {}, m.a + ' ' + sc(m) + ' ' + m.b), h('span', {}, fmtShort(m.ts.slice(0, 10))))))));
    });
    return card;
  }

  /* ---------- Onglet Matchs ---------- */
  function viewMatchs() {
    const s = curSeason();
    const out = h('div', { class: 'stack' });
    const names = ['Tous'].concat(s ? seasonPlayers(s) : []);
    out.append(chips(names, { selected: [filter], onChange: v => { filter = v[0]; render(); } }));
    const list = state.matches.filter(m => m.status !== 'annule' && (!s || m.season === s.id) && (filter === 'Tous' || m.a === filter || m.b === filter))
      .sort((x, y) => byTime(y, x));
    if (!list.length) { out.append(h('p', { class: 'hint' }, 'Aucun match.')); return out; }
    let day = null, grp = null, count = 0;
    const flush = () => { if (grp) { grp.head.append(h('span', {}, ' · ' + plural(count, 'match', 'matchs'))); } };
    list.forEach(m => {
      const d = m.ts.slice(0, 10);
      if (d !== day) { flush(); day = d; count = 0; grp = { head: h('div', { class: 'day' }, fmtDay(d)) }; out.append(grp.head); }
      count++;
      const w = m.status === 'termine' ? winner(m) : null;
      out.append(h('button', { type: 'button', class: 'mrow', onclick: () => editMatch(m), 'aria-label': 'Ouvrir le match ' + m.a + ' contre ' + m.b },
        h('div', { class: 'mline' },
          h('span', { class: 'p' + (w === m.a ? ' w' : '') }, m.a),
          h('span', { class: 'sc' }, m.status === 'termine' ? sc(m) : '– –'),
          h('span', { class: 'p' + (w === m.b ? ' w' : '') }, m.b)),
        h('div', { class: 'sub2' },
          m.status === 'en_cours' ? h('span', { class: 'badge' }, 'En cours') : null,
          m.mods.map(x => h('span', { class: 'tag' }, x)),
          m.by !== 'Import' ? h('span', {}, 'saisi par ' + m.by + ' à ' + m.ts.slice(11, 16)) : null)));
    });
    flush();
    return out;
  }

  /* ---------- Onglet Saison ---------- */
  function closeSeason(s) {
    const S = standings(state, s);
    const sh = openSheet();
    const left = S.total - S.played;
    sh.set(
      h('h2', {}, 'Clôturer ' + s.name),
      S.complete
        ? h('p', {}, S.champion ? 'Tous les matchs sont joués. Le vainqueur est ' + S.champion.name + '.' : 'Tous les matchs sont joués, avec une égalité parfaite en tête : il faut un départage avant de clôturer.')
        : h('p', { class: 'warn' }, 'Il reste ' + plural(left, 'match', 'matchs') + ' à jouer. Le classement ne sera pas définitif.'),
      h('p', { class: 'hint' }, 'La saison passe en archive avec tous ses matchs. Rien n’est supprimé.'),
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'),
        h('button', { type: 'button', class: 'btn primary', onclick: () => {
          s.status = 'archivee'; s.end = nowIso().slice(0, 10);
          state.matches.forEach(m => { if (m.season === s.id && m.status === 'en_cours') m.status = 'annule'; });
          logEntry(s.name + ' clôturée', null); commit(); sh.close(); toast(s.name + ' archivée.'); location.hash = 'classement'; checkPodium();
        } }, S.complete ? 'Clôturer la saison' : 'Clôturer quand même')));
  }

  /* ---------- Podium de fin de saison ---------- */
  const PODIUM_KEY = 'barniotte-podium-vu' + NS;
  let podiumSeen = null;
  try { podiumSeen = JSON.parse(lsGet(PODIUM_KEY)); } catch (e) { podiumSeen = null; }
  const savePodiumSeen = () => lsSet(PODIUM_KEY, JSON.stringify(podiumSeen));

  /* Affiche le podium d'une saison clôturée, une seule fois sur cet appareil. Sans effet si une fenêtre est déjà ouverte : on réessaie à la prochaine mise à jour de l'écran. */
  function checkPodium() {
    if (openSh) return;
    if (API ? !net.loaded : false) return;
    if (HOSTED && !API) return;
    const arch = state.seasons.filter(x => x.status === 'archivee');
    if (!Array.isArray(podiumSeen)) { podiumSeen = arch.map(x => x.id); savePodiumSeen(); return; }
    const nouveaux = arch.filter(x => !podiumSeen.includes(x.id));
    if (!nouveaux.length) return;
    nouveaux.sort((a, b) => String(a.end || '').localeCompare(String(b.end || '')) || (Number(a.id) - Number(b.id)));
    podiumSeen = podiumSeen.concat(nouveaux.map(x => x.id)); savePodiumSeen();
    showPodium(nouveaux[nouveaux.length - 1]);
  }

  function showPodium(s) {
    const S = standings(state, s);
    const top = S.rows.filter(r => r.J > 0).slice(0, 3);
    const sh = openSheet(true);
    const medals = ['gold', 'silver', 'bronze'], places = ['1er', '2e', '3e'];
    const sub = S.complete
      ? (S.champion ? 'Bravo ' + S.champion.name + ' !' : 'Égalité en tête : départage en 3 matchs.')
      : 'Saison clôturée avant la fin : classement au moment de la clôture.';
    const list = h('div', { class: 'podium' });
    top.forEach((r, i) => {
      const bits = [r.V + ' ' + (r.V > 1 ? 'victoires' : 'victoire') + ' sur ' + plural(r.J, 'match', 'matchs') + ' · ' + pct(r.V, r.J)];
      list.append(h('div', { class: 'pod ' + medals[i] },
        h('span', { class: 'pl' }, places[i]),
        h('div', { class: 'pb' },
          h('div', { class: 'pn' }, h('i', { class: 'dot', style: 'background:' + colorOf(r.name) }), h('span', {}, r.name), S.complete && r.tie ? h('span', { class: 'tag' }, 'ex æquo') : null),
          h('div', { class: 'hint' }, bits[0]),
          r.aux ? h('div', { class: 'aux' }, 'Victoire aux points : devant ' + r.aux.over + (r.aux.sameJ ? ' (' + r.aux.pts + ' points marqués contre ' + r.aux.other + ')' : '') + ' à égalité de victoires.') : null)));
    });
    sh.set(h('h2', {}, 'Podium · ' + s.name),
      h('p', { class: 'podium-sub' }, top.length ? sub : 'Aucun match n’a été joué cette saison.'),
      list,
      h('p', { class: 'hint' }, 'Le classement complet et le graphique restent dans « Saisons archivées ».'),
      h('button', { type: 'button', class: 'btn primary', onclick: () => { sh.close(); render(); } }, 'Fermer'));
  }

  /* Une saison ouverte par erreur, sans aucun match, peut être supprimée. Le serveur refuse si un match existe. */
  function delSeasonBtn(s) {
    if (state.matches.some(m => String(m.season) === String(s.id))) return null;
    if (API && !(net.version >= 4)) return null;
    return h('button', { type: 'button', class: 'btn ghost', onclick: () => {
      const sh = openSheet();
      sh.set(h('h2', {}, 'Supprimer ' + s.name + ' ?'),
        h('p', {}, 'Aucun match n’est enregistré dans cette saison. Elle sera effacée du Sheet, pour tout le monde.'),
        h('div', { class: 'btns' },
          h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'),
          h('button', { type: 'button', class: 'btn danger', onclick: () => {
            const i = state.seasons.indexOf(s); if (i < 0) { sh.close(); return; }
            state.seasons.splice(i, 1); logEntry('Saison supprimée (vide) : ' + s.name, null); commit(); sh.close(); toast(s.name + ' supprimée.');
          } }, 'Supprimer')));
    } }, 'Supprimer cette saison (aucun match)');
  }

  function endInter(s) {
    const sh = openSheet();
    sh.set(h('h2', {}, 'Terminer ' + s.name),
      h('p', {}, 'L’intersaison passe en archive avec tous ses matchs. Tu pourras ensuite ouvrir une nouvelle saison.'),
      h('p', { class: 'hint' }, 'Rien n’est supprimé. Il n’y a ni podium ni classement.'),
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'),
        h('button', { type: 'button', class: 'btn primary', onclick: () => {
          s.status = 'archivee_inter'; s.end = nowIso().slice(0, 10);
          state.matches.forEach(m => { if (m.season === s.id && m.status === 'en_cours') m.status = 'annule'; });
          logEntry(s.name + ' terminée', null); commit(); sh.close(); toast(s.name + ' archivée.');
        } }, 'Terminer l’intersaison')));
  }

  /* Le formulaire de nouvelle saison garde son brouillon : une synchro qui apporte des données redessine l'écran sans effacer le nom, le type, les joueurs ni le nombre de matchs. */
  let seasonDraft = null, playerDraft = '';
  function newSeasonForm() {
    const act = state.players.filter(p => p.active).map(p => p.name);
    const defName = k => (k === 'Intersaison' ? 'Intersaison' : 'Saison ' + nextSeasonId());
    const d = seasonDraft;
    let touched = !!(d && d.touched);
    let kind = d ? d.kind : 'Saison', picked = d && touched ? d.picked.filter(n => act.includes(n)) : act.slice(), quota = d ? d.quota : 10;
    let name = d ? d.name : defName(kind);
    const keep = () => { seasonDraft = { kind, picked: picked.slice(), quota, name, touched }; };
    const box = h('div', { class: 'card stack' });
    const draw = () => {
      keep();
      const inter = kind === 'Intersaison';
      const nameIn = h('input', { type: 'text', id: 'ns-name', value: name, 'aria-label': inter ? 'Nom de l’intersaison' : 'Nom de la saison' });
      nameIn.addEventListener('input', () => { name = nameIn.value; keep(); });
      const bad = badText(name.trim(), 60);
      box.replaceChildren(...[
        h('h2', { class: 'sec-h' }, inter ? 'Nouvelle intersaison' : 'Nouvelle saison'),
        chips(['Saison', 'Intersaison'], { selected: [kind], onChange: v => { if (name === defName(kind)) name = defName(v[0]); kind = v[0]; draw(); } }),
        h('div', {}, h('div', { class: 'lbl hint' }, 'Nom'), nameIn),
        inter ? null : h('div', {}, h('div', { class: 'lbl hint' }, 'Joueurs classés (une fois la saison lancée, plus d’ajout)'),
          chips(act, { multi: true, selected: picked, onChange: v => { picked = v; touched = true; draw(); } })),
        inter ? null : h('div', { class: 'row' }, h('span', {}, 'Matchs par duo'),
          h('div', { class: 'stepper' },
            h('button', { type: 'button', 'aria-label': 'Moins', disabled: quota <= 1, onclick: () => { quota--; draw(); } }, '−'), h('output', {}, String(quota)),
            h('button', { type: 'button', 'aria-label': 'Plus', disabled: quota >= 40, onclick: () => { quota++; draw(); } }, '+'))),
        bad ? h('p', { class: 'hint err' }, 'Nom : ' + bad) : null,
        inter
          ? h('p', { class: 'hint' }, 'Tous les joueurs actifs peuvent jouer, y compris un joueur ajouté pendant l’intersaison. Les matchs sont gardés dans l’historique mais ne comptent pour aucun classement.')
          : (picked.length >= 2 ? h('p', { class: 'hint' }, plural(picked.length * (picked.length - 1) / 2 * quota, 'match', 'matchs') + ' à jouer au total.') : h('p', { class: 'hint err' }, 'Choisis au moins deux joueurs.')),
        h('button', { type: 'button', class: 'btn primary', disabled: !name.trim() || !!bad || (inter ? act.length < 2 : picked.length < 2), onclick: () => {
          seasonDraft = null;
          if (inter) {
            const s = { id: nextSeasonId(), name: name.trim(), start: nowIso().slice(0, 10), end: null, status: 'inter', quota: 1, players: act.slice().sort(fr) };
            state.seasons.push(s); logEntry(s.name + ' ouverte (sans classement)', null); commit(); toast(s.name + ' ouverte.'); location.hash = 'classement';
            return;
          }
          const s = { id: nextSeasonId(), name: name.trim(), start: nowIso().slice(0, 10), end: null, status: 'en_cours', quota, players: picked.slice().sort(fr) };
          state.seasons.push(s); logEntry(s.name + ' ouverte : ' + s.players.join(', ') + ', ' + quota + ' matchs par duo', null); commit(); toast(s.name + ' ouverte.'); location.hash = 'classement';
        } }, inter ? 'Ouvrir l’intersaison' : 'Ouvrir la saison')].filter(Boolean));
    };
    draw();
    return box;
  }

  function deletePlayer(p) {
    const s = curSeason();
    const n = state.matches.filter(m => m.a === p.name || m.b === p.name).length;
    const sh = openSheet();
    const close = h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Fermer');
    if (s && !isInter(s) && s.players.includes(p.name)) {
      sh.set(h('h2', {}, 'Supprimer ' + p.name),
        h('p', {}, p.name + ' joue la saison en cours : il apparaît au classement. Tu pourras le supprimer après la clôture de la saison, s\u2019il n\u2019a aucun match enregistré.'), close);
    } else if (n > 0) {
      sh.set(h('h2', {}, 'Supprimer ' + p.name),
        h('p', {}, p.name + ' a ' + plural(n, 'match', 'matchs') + ' dans l\u2019historique. Les supprimer fausserait les classements des saisons archivées.'),
        h('p', { class: 'hint' }, 'Passe-le plutôt en inactif : il disparaît des choix pour les prochaines saisons et son historique reste intact.'),
        h('div', { class: 'btns' }, close, p.active ? h('button', { type: 'button', class: 'btn primary', onclick: () => { p.active = false; commit(); sh.close(); toast(p.name + ' est inactif.'); } }, 'Passer inactif') : null));
    } else {
      sh.set(h('h2', {}, 'Supprimer ' + p.name),
        h('p', {}, p.name + ' n\u2019a joué aucun match. Le supprimer de la liste ?'),
        h('div', { class: 'btns' },
          h('button', { type: 'button', class: 'btn ghost', onclick: () => sh.close() }, 'Annuler'),
          h('button', { type: 'button', class: 'btn danger', onclick: () => {
            state.players = state.players.filter(x => x !== p);
            state.seasons.forEach(x => { x.players = x.players.filter(y => y !== p.name); });
            logEntry('Joueur supprimé : ' + p.name, null);
            const wasMe = me === p.name;
            if (wasMe) { me = null; try { localStorage.removeItem(ME_KEY); } catch (e) { /* ignoré */ } }
            commit(); sh.close(); toast(p.name + ' supprimé.'); if (wasMe) askWho();
          } }, 'Supprimer')));
    }
  }

  /* Groupe tout neuf : aucun joueur. On explique par où commencer. */
  const isEmptyGroup = () => state.players.length === 0 && (!API || net.loaded);
  function welcomeCard() {
    const go = () => {
      if (location.hash !== '#saison') location.hash = 'saison';
      setTimeout(() => { const i = document.getElementById('new-player'); if (i) { i.focus(); if (i.scrollIntoView) i.scrollIntoView({ block: 'center' }); } }, 120);
    };
    return h('div', { class: 'card stack welcome' },
      h('h2', { class: 'sec-h' }, 'Bienvenue'),
      h('p', {}, 'Ce groupe est vide. Pour démarrer :'),
      h('ol', { class: 'steps' },
        h('li', {}, h('b', {}, 'Ajoute les joueurs'), ' dans l’onglet Gestion, section Joueurs.'),
        h('li', {}, h('b', {}, 'Ouvre une saison'), ' (ou une intersaison, sans classement) avec ces joueurs.'),
        h('li', {}, h('b', {}, 'Choisis ton nom'), ' quand l’appli le demande, puis enregistre le premier match avec le bouton +.')),
      tokenMode() && !token && net.admins.length
        ? h('div', { class: 'stack' },
          h('p', { class: 'hint' }, 'Les codes PIN sont activés : seul le créateur du groupe (' + net.admins.join(', ') + ') peut ajouter les joueurs. Commence par t’identifier.'),
          h('button', { type: 'button', class: 'btn primary', onclick: () => askWho() }, 'Je suis le créateur : créer mon code PIN'))
        : h('button', { type: 'button', class: 'btn primary', onclick: go }, 'Ajouter les joueurs'));
  }

  function viewSaison() {
    const s = curSeason();
    const out = h('div', { class: 'stack' });
    if (isEmptyGroup()) out.append(welcomeCard());
    if (!API) out.append(h('p', { class: 'note' }, 'Prototype : les données restent sur cet appareil. La synchronisation avec Google Sheets viendra ensuite.'));

    if (API) out.append(h('div', { class: 'card' }, linkBtn('regles.html', 'Règles')));

    out.append(h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Affichage'),
      chips(['Auto', 'Clair', 'Sombre'], { selected: [THEME_NAMES[theme]], onChange: v => setTheme(THEME_KEYS[v[0]]) }),
      h('p', { class: 'hint' }, 'Auto suit le réglage de ton téléphone. Clair ou Sombre force l\u2019affichage.')));

    out.append(h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Mon identité'),
      chips(state.players.filter(p => p.active).map(p => p.name), { selected: me ? [me] : [], onChange: v => { if (v[0] === me && !needsPin()) return; if (pinOn()) enterIdentity(v[0]); else { setMe(v[0]); render(); } } }),
      pinOn() ? h('p', { class: 'hint' }, 'Pour prendre l’identité d’un autre joueur, il faut son code PIN.') : null));

    const adm = isAdmin();
    if (!adm) {
      out.append(h('div', { class: 'card stack' },
        h('h2', { class: 'sec-h' }, s ? s.name + ' · depuis le ' + fmtShort(s.start) : 'Aucune saison en cours'),
        s ? h('p', { class: 'hint' }, isInter(s) ? 'Intersaison : les matchs ne comptent pour aucun classement.' : 'Quota : ' + s.quota + ' matchs par duo. Joueurs : ' + s.players.join(', ') + '.') : null,
        h('p', { class: 'hint' }, 'Ouvrir ou clôturer une saison, gérer les joueurs et le lien d’invitation est réservé aux administrateurs' + (net.admins.length ? ' (' + net.admins.join(', ') + ')' : '') + '.')));
    } else if (s && isInter(s)) {
      out.append(h('div', { class: 'card stack' },
        h('h2', { class: 'sec-h' }, s.name + ' · depuis le ' + fmtShort(s.start)),
        h('p', { class: 'hint' }, 'Les matchs sont gardés dans l’historique mais ne comptent pour aucun classement. Tous les joueurs actifs peuvent jouer, y compris un joueur ajouté pendant l’intersaison.'),
        h('button', { type: 'button', class: 'btn', onclick: () => endInter(s) }, 'Terminer l’intersaison'),
        delSeasonBtn(s)));
    } else if (s) {
      const S = standings(state, s);
      const floor = maxPairCount(state, s);
      const setQuota = q => { logEntry('Matchs par duo : ' + s.quota + ' → ' + q, null); s.quota = q; commit(); };
      out.append(h('div', { class: 'card stack' },
        h('h2', { class: 'sec-h' }, s.name + ' · depuis le ' + fmtShort(s.start)),
        h('div', { class: 'row' }, h('span', {}, 'Matchs par duo'),
          h('div', { class: 'stepper' },
            h('button', { type: 'button', 'aria-label': 'Moins', disabled: s.quota <= Math.max(1, floor), onclick: () => setQuota(s.quota - 1) }, '−'),
            h('output', {}, String(s.quota)),
            h('button', { type: 'button', 'aria-label': 'Plus', disabled: s.quota >= 40, onclick: () => setQuota(s.quota + 1) }, '+'))),
        h('p', { class: 'hint' }, floor > 0 ? 'Le quota ne peut pas passer sous ' + floor + ', nombre de matchs déjà joués par le duo le plus actif.' : 'Modifiable tant qu’aucun match n’est enregistré.'),
        h('p', { class: 'hint' }, S.played + ' / ' + S.total + ' matchs joués. Joueurs : ' + s.players.join(', ') + '.'),
        h('button', { type: 'button', class: 'btn', onclick: () => closeSeason(s) }, 'Clôturer la saison'),
        delSeasonBtn(s)));
    } else out.append(newSeasonForm());
    if (adm && tokenMode()) out.append(adminCard());

    const pl = h('div', { class: 'card stack' }, h('h2', { class: 'sec-h' }, 'Joueurs'),
      h('p', { class: 'hint' }, s && isInter(s) ? 'Un joueur ajouté pendant l’intersaison peut jouer tout de suite. Dans une saison classée, il joue à partir de la suivante.' : 'Un joueur ajouté joue à partir de la saison suivante, jamais en cours de saison.'));
    const list = h('div', { class: 'plist' });
    state.players.forEach(p => {
      const inSeason = s && !isInter(s) && s.players.includes(p.name);
      list.append(h('div', { class: 'row' },

  /* ---------- Synchronisation avec le Google Sheet ---------- */
  const CODE_KEY = 'barniotte-code' + NS, OUT_KEY = 'barniotte-outbox' + NS;
  let code = '';
  try { code = localStorage.getItem(CODE_KEY) || ''; } catch (e) { code = ''; }
  let outbox = [];
  try { outbox = JSON.parse(localStorage.getItem(OUT_KEY) || '[]'); } catch (e) { outbox = []; }
  const net = { state: API ? (code ? 'idle' : 'locked') : (HOSTED ? 'locked' : 'local'), version: null, rev: null, busy: false, again: false, loaded: false, tick: 0, at: '', error: '', polling: false };
  const PINOK_KEY = 'barniotte-pinok' + NS, PININFO_KEY = 'barniotte-pininfo' + NS;
  let pinok = lsGet(PINOK_KEY) || '';
  net.pin = false; net.pinned = []; net.admins = []; net.me = null; net.skew = 0;
  /* Jeton de session : donné par le serveur après un PIN correct, renvoyé à chaque échange. Le PIN lui-même n'est jamais gardé sur le téléphone. */
  const TOKEN_KEY = 'barniotte-token' + NS;
  let token = lsGet(TOKEN_KEY) || '';
  const setToken = t => { token = t || ''; if (token) lsSet(TOKEN_KEY, token); else lsDel(TOKEN_KEY); };
  const tokenMode = () => !!(API && net.pin && net.version >= 5);
  const isAdmin = () => !tokenMode() || !net.me || !!net.me.admin;
  const serverNow = () => Date.now() + (net.skew || 0);
  const DELAI_MATCH_MS = 10 * 60000;
  const ERR_FR = { admin: 'réservé aux administrateurs', delai: 'le délai de 10 minutes est dépassé', session: 'session expirée', inactif: 'accès coupé', pin_requis: 'PIN à confirmer', dernier_admin: 'il doit rester au moins un administrateur actif', admin_fixe: 'cet administrateur est défini dans le script', joueur_sans_pin: 'ce joueur doit d’abord créer son code PIN', pin_format: 'le code doit faire 6 chiffres, pas trop évidents', joueur: 'joueur introuvable', code_invalide: 'code invalide (16 à 60 caractères : lettres, chiffres, - et _)' };
  const errFr = e => ERR_FR[e] || e || 'erreur';
  try { const pi = JSON.parse(lsGet(PININFO_KEY) || 'null'); if (pi) { net.pin = !!pi.on; net.pinned = Array.isArray(pi.names) ? pi.names.filter(n => typeof n === 'string') : []; } } catch (e) { /* ignoré */ }
  const savePinInfo = () => lsSet(PININFO_KEY, JSON.stringify({ on: net.pin, names: net.pinned }));
  let snap = null;
  const saveOutbox = () => { try { localStorage.setItem(OUT_KEY, JSON.stringify(outbox)); } catch (e) { /* ignoré */ } };
  const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const nextSeasonId = () => state.seasons.reduce((n, s) => Math.max(n, Number(s.id) || 0), 0) + 1;

  const pickMatch = m => ({ id: String(m.id), season: Number(m.season), ts: m.ts, a: m.a, b: m.b, sa: m.sa == null ? null : m.sa, sb: m.sb == null ? null : m.sb, status: m.status, mods: (m.mods || []).slice(), by: m.by || '' });
  const pickSeason = s => ({ id: Number(s.id), name: s.name, start: s.start, end: s.end || null, status: s.status, quota: s.quota, players: s.players.slice() });
  const pickPlayer = p => ({ name: p.name, active: !!p.active, c: p.c == null ? 0 : p.c });
  const logKey = l => [l.ts, l.by, l.match == null ? '' : l.match, l.what].join('|');

  /* Mémorise l'état connu du serveur, pour ne renvoyer que ce qui change. */
  function takeSnap() {
    snap = { m: {}, s: {}, p: {}, l: new Set() };
    state.matches.forEach(m => { snap.m[m.id] = JSON.stringify(pickMatch(m)); });
    state.seasons.forEach(s => { snap.s[s.id] = JSON.stringify(pickSeason(s)); });
    state.players.forEach(p => { snap.p[p.name] = JSON.stringify(pickPlayer(p)); });
    state.log.forEach(l => snap.l.add(logKey(l)));
  }

  /* Compare l'état local à ce que le serveur connaît et prépare les envois. */
  function queue() {
    if (!API || !snap) return;
    const ops = [];
    state.matches.forEach(m => { const j = JSON.stringify(pickMatch(m)); if (snap.m[m.id] !== j) { ops.push({ t: 'match', row: JSON.parse(j) }); snap.m[m.id] = j; } });
    state.seasons.forEach(s => { const j = JSON.stringify(pickSeason(s)); if (snap.s[s.id] !== j) { ops.push({ t: 'season', row: JSON.parse(j) }); snap.s[s.id] = j; } });
    state.players.forEach(p => { const j = JSON.stringify(pickPlayer(p)); if (snap.p[p.name] !== j) { ops.push({ t: 'player', row: JSON.parse(j) }); snap.p[p.name] = j; } });
    Object.keys(snap.p).forEach(n => { if (!state.players.some(p => p.name === n)) { ops.push({ t: 'playerDel', name: n }); delete snap.p[n]; } });
    Object.keys(snap.s).forEach(id => { if (!state.seasons.some(s => String(s.id) === id)) { ops.push({ t: 'seasonDel', id: Number(id) }); delete snap.s[id]; } });
    state.log.slice().reverse().forEach(l => {
      const k = logKey(l);
      if (!snap.l.has(k)) { ops.push({ t: 'log', row: { ts: l.ts, by: l.by, match: l.match == null ? null : String(l.match), what: l.what } }); snap.l.add(k); }
    });
    if (ops.length) { outbox.push(...ops); saveOutbox(); paintNet(); }
    setTimeout(() => syncNow(false), 50);
  }

  function mergeList(local, remote, keyOf) {
    const idx = new Map(local.map(x => [keyOf(x), x]));
    const seen = new Set();
    remote.forEach(r => {
      const k = keyOf(r); seen.add(k);
      const l = idx.get(k);
      if (l) { Object.keys(l).forEach(f => { if (!(f in r)) delete l[f]; }); Object.assign(l, r); } else local.push(r);
    });
    for (let i = local.length - 1; i >= 0; i--) if (!seen.has(keyOf(local[i]))) local.splice(i, 1);
  }

  /* Reprend l'état du serveur en gardant les mêmes objets, pour que les fenêtres ouvertes restent valables. */
  const stamp = () => JSON.stringify([state.players, state.seasons, state.matches, state.log]);
  function adopt(srv, rev) {
    const before = stamp(), wasLoaded = net.loaded;
    mergeList(state.players, srv.players, p => p.name);
    mergeList(state.seasons, srv.seasons, s => String(s.id));
    mergeList(state.matches, srv.matches, m => String(m.id));
    state.log = srv.log;
    net.rev = rev; net.loaded = true;
    takeSnap(); save();
    if (!wasLoaded || before !== stamp()) render();
  }

  async function call(action, extra) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    try {
      const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ code, action }, token ? { token } : {}, extra || {})), signal: ctl.signal });
      const j = await res.json();
      if (j && j.ok) { if (typeof j.version === 'number') net.version = j.version; else if (net.version == null) net.version = 0; }
      if (j && typeof j.pin === 'boolean') { net.pin = j.pin; net.pinned = Array.isArray(j.pinned) ? j.pinned : []; savePinInfo(); }
      if (j && j.ok) {
        if (typeof j.token === 'string' && j.token) setToken(j.token);
        if (typeof j.now === 'number') net.skew = j.now - Date.now();
        if (Array.isArray(j.admins)) net.admins = j.admins;
        if ('me' in j) {
          net.me = j.me && typeof j.me === 'object' ? j.me : null;
          if (!net.me && token && net.pin) { setToken(''); pinok = ''; lsDel(PINOK_KEY); }   // jeton refusé : il faudra ressaisir le PIN
        }
      }
      return j;
    } finally { clearTimeout(timer); }
  }
  const serverErr = r => { const e = new Error(r.error || 'erreur'); e.server = true; e.code = r.error; return e; };

  /* Un vrai refus du serveur (droits, validation) : l'opération est abandonnée. Toute autre erreur (verrou occupé, panne) : on garde la file et on réessaiera. */
  const isRefusal = e => /^(Opération \d|admin$|delai$|dernier_admin$)/.test(String(e || ''));
  async function flush() {
    while (outbox.length) {
      const batch = outbox.slice(0, 100);
      const r = await call('apply', { ops: batch });
      if (r.ok) {
        outbox.splice(0, batch.length); saveOutbox(); net.rev = r.rev;
        if (!outbox.length) adopt(r.state, r.rev);
        continue;
      }
      if (r.error === 'code' || r.error === 'session' || r.error === 'inactif' || r.error === 'pin_requis' || !isRefusal(r.error)) throw serverErr(r);
      /* Le serveur a refusé le lot : on isole l'opération fautive pour ne pas bloquer les autres. */
      let refused = 0, reason = r.error;
      for (const op of batch) {
        const one = await call('apply', { ops: [op] });
        if (one.error === 'code' || one.error === 'session' || one.error === 'inactif' || one.error === 'pin_requis' || (!one.ok && !isRefusal(one.error))) throw serverErr(one);
        if (!one.ok) { refused++; reason = one.error; }
      }
      outbox.splice(0, batch.length); saveOutbox(); net.rev = null;
      if (refused) toast(plural(refused, 'modification refusée', 'modifications refusées') + ' par le serveur : ' + errFr(reason));
    }
  }

  async function syncNow(force) {
    if (!API || !code) return;
    if (net.busy) { net.again = true; return; }
    const viewKey = () => [net.loaded, net.version, net.pin, net.pinned.join(','), net.admins.join(','), net.me ? net.me.admin + ':' + net.me.fresh : '', net.state === 'sync' ? 'ok' : net.state, net.error].join('|');
    const view0 = viewKey();
    net.busy = true; net.state = 'sync'; paintNet();
    try {
      if (outbox.length) await flush();
      if (!outbox.length) {
        net.tick++;
        const r = await call('sync', { since: force || net.tick % 4 === 0 ? null : net.rev });
        if (!r.ok) throw serverErr(r);
        if (outbox.length) net.again = true;
        else if (!r.unchanged) adopt(r.state, r.rev); else net.rev = r.rev;
      }

        }

      if (net.again) { net.again = false; setTimeout(() => syncNow(false), 200); }
    }
  }

  function paintNet() {

    el.disabled = !API;
  }

  /* Lit #api=…&code=… (ou l'ancien #code=…) puis efface l'adresse pour que le code ne reste pas visible. */
  function takeLinkFromHash() {
    const hs = location.hash || '';
    if (!/^#(?:.*&)?(?:api|code)=/.test(hs)) return null;
    let p;
    try { p = new URLSearchParams(hs.slice(1)); } catch (e) { return null; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignoré */ }
    return { api: p.get('api') || '', code: p.get('code') || '' };
  }

  /* Lit un lien d'invitation collé : renvoie { api, code } ou null. */
  function parseInvite(v) {
